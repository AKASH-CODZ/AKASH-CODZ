name: snake

# Redraws the contribution-graph snake. Output is committed to assets/generated/
# on main (no separate branch, no force pushes). Actions are pinned to commit SHAs.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-light.svg
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#00c6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet && exit 0
          git commit -m "chore: redraw contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
