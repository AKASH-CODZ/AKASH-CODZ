name: snake

# Redraws the contribution-graph snake using our own .github/scripts/snake.py,
# not the third-party Platane/snk action: this repo's Actions settings only allow
# GitHub-owned actions (see docs/readme-flags.md), so a third-party action fails
# with startup_failure before it ever runs a step. Output is committed to
# assets/generated/ on main — no separate branch, no force pushes.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml", ".github/scripts/snake.py"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the generator
        working-directory: .github/scripts
        run: python3 -m unittest -v test_snake

      - name: Draw the snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/snake.py --user "${{ github.repository_owner }}" --out assets/generated

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet && exit 0
          git commit -m "chore: redraw contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
